name: ${COMPOSE_PROJECT_NAME:-adventureworks}

services:
  # --- SQL Server with AdventureWorks2022 (restored on first start) ---
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${COMPOSE_PROJECT_NAME:-adventureworks}_db
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_DB: ${MSSQL_DB:-AdventureWorks2022}
    volumes:
      - mssql_data:/var/opt/mssql
      - ../data/source:/backup:ro
      - ./mssql_entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/opt/mssql/.restored && /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"USE [$$MSSQL_DB]\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    restart: "no"

  # --- Python analysis / ML environment (JupyterLab) ---
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-adventureworks}_app:latest
    container_name: ${COMPOSE_PROJECT_NAME:-adventureworks}_app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /opt/adventureworks
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    environment:
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /opt/adventureworks
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: ${MSSQL_DB:-AdventureWorks2022}
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ../:/opt/adventureworks
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --ServerApp.token='' --ServerApp.root_dir=/opt/adventureworks
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4
    restart: "no"

  # --- Streamlit dashboard (reads data/processed + outputs from the pipeline) ---
  dashboard:
    image: ${COMPOSE_PROJECT_NAME:-adventureworks}_app:latest
    container_name: ${COMPOSE_PROJECT_NAME:-adventureworks}_dashboard
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /opt/adventureworks
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    environment:
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /opt/adventureworks
    volumes:
      - ../:/opt/adventureworks
    command: >
      streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
      --server.headless=true --browser.gatherUsageStats=false
    depends_on:
      - app
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    restart: "no"

volumes:
  mssql_data:
